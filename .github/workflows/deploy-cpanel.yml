name: Deploy Vue.js to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # 1. Checkout code
      # ----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------
      # 2. Setup Node.js
      # ----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ----------------------------
      # 3. Install dependencies
      # ----------------------------
      - name: Install Dependencies
        run: npm ci || npm install

      # ----------------------------
      # 4. Build Vue project
      # ----------------------------
      - name: Build Project
        run: npm run build

      # ----------------------------
      # 5. Install rsync (FIX FOR YOUR ERROR)
      # ----------------------------
      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      # ----------------------------
      # 6. Setup SSH (BASE64 KEY FIXED)
      # ----------------------------
      - name: Setup SSH Key (Base64)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.CPANEL_SSH_KEY_B64 }}" | tr -d '\r\n ' | base64 --decode > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null

          ssh-keyscan -H "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts

      # ----------------------------
      # 7. Test SSH connection
      # ----------------------------
      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/id_rsa \
            -p ${{ secrets.CPANEL_PORT || 22 }} \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            "echo SSH OK"

      # ----------------------------
      # 8. Deploy to cPanel (public_html)
      # ----------------------------
      - name: Deploy Vue dist
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -p ${{ secrets.CPANEL_PORT || 22 }}" \
            dist/ \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:/home/${{ secrets.CPANEL_USER }}/public_html/

      # ----------------------------
      # 9. Done
      # ----------------------------
      - name: Success
        run: echo "🚀 Vue.js deployed successfully to cPanel"