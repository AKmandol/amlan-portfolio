name: Deploy Vue.js to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Project
        run: npm run build

      - name: Configure SSH
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_SSH_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
        run: |
          set -e

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          echo "$CPANEL_SSH_KEY_B64" | base64 -d > "$HOME/.ssh/id_rsa"

          chmod 600 "$HOME/.ssh/id_rsa"

          ssh-keygen -y -f "$HOME/.ssh/id_rsa" > /dev/null

          ssh-keyscan -p ${CPANEL_PORT:-22} -H "$CPANEL_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Test SSH Connection
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          ssh \
            -i "$HOME/.ssh/id_rsa" \
            -o StrictHostKeyChecking=yes \
            -p ${CPANEL_PORT:-22} \
            ${CPANEL_USER}@${CPANEL_HOST} \
            "echo 'SSH Connected Successfully'"

      - name: Create Deploy Directory
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          ssh \
            -i "$HOME/.ssh/id_rsa" \
            -p ${CPANEL_PORT:-22} \
            ${CPANEL_USER}@${CPANEL_HOST} \
            "mkdir -p '$CPANEL_DEPLOY_PATH'"

      - name: Deploy dist Folder
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/id_rsa -p ${CPANEL_PORT:-22}" \
            dist/ \
            ${CPANEL_USER}@${CPANEL_HOST}:${CPANEL_DEPLOY_PATH}/

      - name: Finished
        run: echo "✅ Deployment Successful"