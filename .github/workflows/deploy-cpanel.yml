# ----------------------------
# Install rsync (MUST BE FIRST)
# ----------------------------
- name: Install rsync
  run: |
    sudo apt-get update
    sudo apt-get install -y rsync
    rsync --version

# ----------------------------
# Setup SSH Key (BASE64)
# ----------------------------
- name: Setup SSH Key
  run: |
    mkdir -p ~/.ssh
    chmod 700 ~/.ssh

    echo "${{ secrets.CPANEL_SSH_KEY_B64 }}" | tr -d '\r\n ' | base64 --decode > ~/.ssh/id_rsa

    chmod 600 ~/.ssh/id_rsa

    ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null

    ssh-keyscan -H "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts

# ----------------------------
# Test SSH
# ----------------------------
- name: Test SSH
  run: |
    ssh -i ~/.ssh/id_rsa \
      -p ${{ secrets.CPANEL_PORT || 22 }} \
      ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
      "echo SSH OK"

# ----------------------------
# Deploy with rsync
# ----------------------------
- name: Deploy Vue dist
  run: |
    rsync -avz --delete \
      -e "ssh -i ~/.ssh/id_rsa -p ${{ secrets.CPANEL_PORT || 22 }}" \
      dist/ \
      ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:/home/${{ secrets.CPANEL_USER }}/public_html/