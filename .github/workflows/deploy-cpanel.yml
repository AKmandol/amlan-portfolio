name: Deploy Vue.js to cPanel (Clean Replace)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # 1. Checkout
      # ----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------
      # 2. Setup Node
      # ----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ----------------------------
      # 3. Install dependencies
      # ----------------------------
      - name: Install Dependencies
        run: npm ci || npm install

      # ----------------------------
      # 4. Build Vue
      # ----------------------------
      - name: Build Project
        run: npm run build

      # ----------------------------
      # 5. Setup SSH (BASE64)
      # ----------------------------
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.CPANEL_SSH_KEY_B64 }}" \
            | tr -d '\r\n ' \
            | base64 --decode > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null

          ssh-keyscan -H "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts

      # ----------------------------
      # 6. DELETE old public_html
      # ----------------------------
      - name: Clean cPanel directory
        run: |
          ssh -i ~/.ssh/id_rsa \
            -p ${{ secrets.CPANEL_PORT || 22 }} \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            "rm -rf ~/public_html/*"

      # ----------------------------
      # 7. Upload new dist folder
      # ----------------------------
      - name: Upload dist folder
        run: |
          scp -r -i ~/.ssh/id_rsa \
            -P ${{ secrets.CPANEL_PORT || 22 }} \
            dist/* \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:/home/${{ secrets.CPANEL_USER }}/public_html/

      # ----------------------------
      # 8. Done
      # ----------------------------
      - name: Success
        run: echo "🚀 Clean Vue deploy completed"