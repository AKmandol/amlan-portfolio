name: Vue.js CI/CD to cPanel (Zero Downtime)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RELEASE_DIR: releases
      CURRENT_DIR: current

    steps:
      # ----------------------------
      # 1. Checkout code
      # ----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------
      # 2. Setup Node with cache
      # ----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ----------------------------
      # 3. Install dependencies (cached)
      # ----------------------------
      - name: Install Dependencies
        run: npm ci || npm install

      # ----------------------------
      # 4. Build Vue project
      # ----------------------------
      - name: Build Project
        run: npm run build

      # ----------------------------
      # 5. Setup SSH (FIXED - RAW KEY ONLY)
      # ----------------------------
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null
          ssh-keyscan -H "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts

      # ----------------------------
      # 6. Create remote release folder
      # ----------------------------
      - name: Prepare Remote Server
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.CPANEL_PORT }} \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} << 'EOF'

          mkdir -p $HOME/${{ env.RELEASE_DIR }}
          mkdir -p $HOME/${{ env.CURRENT_DIR }}

          EOF

      # ----------------------------
      # 7. Upload build to new release folder
      # ----------------------------
      - name: Upload New Release (rsync)
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          echo "RELEASE=$TIMESTAMP" >> $GITHUB_ENV

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -p ${{ secrets.CPANEL_PORT }}" \
            dist/ \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:~/${{ env.RELEASE_DIR }}/$TIMESTAMP/

      # ----------------------------
      # 8. Switch symlink (ZERO DOWNTIME)
      # ----------------------------
      - name: Activate New Release
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.CPANEL_PORT }} \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} << EOF

          ln -sfn \$HOME/${{ env.RELEASE_DIR }}/${{ env.RELEASE }} \$HOME/${{ env.CURRENT_DIR }}

          EOF

      # ----------------------------
      # 9. Optional cleanup (keep last 3 releases)
      # ----------------------------
      - name: Cleanup Old Releases
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.CPANEL_PORT }} \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} << 'EOF'

          cd $HOME/releases
          ls -1t | tail -n +4 | xargs rm -rf || true

          EOF

      # ----------------------------
      # 10. Done
      # ----------------------------
      - name: Success
        run: echo "🚀 Deployment completed with ZERO DOWNTIME"