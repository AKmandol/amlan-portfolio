name: Deploy Vue.js to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # 1. Checkout code
      # ----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------
      # 2. Setup Node.js
      # ----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ----------------------------
      # 3. Install dependencies
      # ----------------------------
      - name: Install Dependencies
        run: npm ci || npm install

      # ----------------------------
      # 4. Build Vue project
      # ----------------------------
      - name: Build Project
        run: npm run build

      # ----------------------------
      # 5. Setup SSH Key (FIXED - NO BASE64)
      # ----------------------------
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null

          ssh-keyscan -H "${{ secrets.CPANEL_HOST }}" >> ~/.ssh/known_hosts

      # ----------------------------
      # 6. Test SSH Connection
      # ----------------------------
      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/id_rsa \
            -p ${{ secrets.CPANEL_PORT }} \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            "echo SSH OK"

      # ----------------------------
      # 7. Create remote directory
      # ----------------------------
      - name: Create Remote Folder
        run: |
          ssh -i ~/.ssh/id_rsa \
            -p ${{ secrets.CPANEL_PORT }} \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} \
            "mkdir -p ${{ secrets.CPANEL_DEPLOY_PATH }}"

      # ----------------------------
      # 8. Deploy via rsync
      # ----------------------------
      - name: Deploy dist folder
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -p ${{ secrets.CPANEL_PORT }}" \
            dist/ \
            ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.CPANEL_DEPLOY_PATH }}/

      # ----------------------------
      # 9. Done
      # ----------------------------
      - name: Success Message
        run: echo "Deployment completed successfully 🚀"